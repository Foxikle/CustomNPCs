commands.help.movedata.description=Relocates any local NPC data to the currently configured storage provider
commands.help.movedata.hover=Stores any local NPC data in the storage provider. The three operators, MERGE_LOCAL, MERGE_REMOTE, and OVERWRITE, determine how conflicts are handled. MERGE_REMOTE tries to merge the two lists of NPCs, discarding the local duplicate (by uuid, settings, equipment, etc are not considdered). MERGE_LOCAL tries to merge the two lists, but it discards the remote duplicates. OVERWRITE completley wipes the storage provider and replaces it with the local data.
